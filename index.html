<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #00ff00;
      overflow: hidden;
      background: black;
      position: relative;
    }

    /* 🔹 Canvas Background (Hacker Style) */
    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: black;
    }

    /* 🔹 Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0px 2px 10px #00ff00;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav h2 {
      color: #00ff00;
      font-size: 24px;
      text-shadow: 0 0 15px #00ff00;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    /* 🔹 Main Container */
    .container {
      flex: 1;
      text-align: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      box-shadow: 0px 0px 30px #00ff00;
      animation: fadeIn 2s ease-in-out;
      margin: auto;
      width: 90%;
      max-width: 500px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .container img {
      width: 200px;
      height: 250px;
      border-radius: 50%;
      border: 4px solid #00ff00;
      margin-bottom: 20px;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 10px #00ff00; }
      to { box-shadow: 0 0 30px #00ff00; }
    }

    h1 {
      font-size: 35px;
      margin-bottom: 10px;
      color: #00ff00;
      text-shadow: 0 0 20px #00ff00;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #ddd;
    }

    .btn {
      padding: 12px 25px;
      background: #00ff00;
      color: black;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.4s;
      box-shadow: 0 0 15px #00ff00;
      display: inline-block;
    }

    .btn:hover {
      background: black;
      color: #00ff00;
      box-shadow: 0 0 25px #00ff00;
    }

    /* 🔹 Footer */
    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0px -2px 10px #00ff00;
      font-size: 14px;
      color: #bbb;
    }

    footer span {
      color: #00ff00;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- 🔹 Canvas Background -->
  <canvas id="gameCanvas"></canvas>

  <!-- 🔹 Navigation Bar -->
  <nav>
    <h2>Prince</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- 🔹 Main Landing Content -->
  <div class="container">
    <img src="prince.jpg" alt="Prince">
    <h1>Prince</h1>
    <p>Welcome to my Website 💻</p>
    <a href="service.html" class="btn">Enter System</a>
  </div>

  <!-- 🔹 Footer -->
  <footer>
    © 2025 <span>Prince</span>. All Rights Reserved.
  </footer>

  <!-- 🔹 JavaScript for Hacker Background -->
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 120;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        dx: (Math.random() - 0.5) * 1,
        dy: (Math.random() - 0.5) * 1
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, i) => {
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#00ff00";
        ctx.fill();

        // glowing green lines
        particles.forEach((p2, j) => {
          if (i !== j) {
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 100) {
              ctx.strokeStyle = "rgba(0,255,0,0.2)";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        });
      });

      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
