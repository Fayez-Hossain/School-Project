<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        .services {
            background: linear-gradient(to right, black, #0f9d58); /* black to green gradient */
            padding: 50px 20px;
            text-align: center;
        }

        .services h1 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #0f9d58; /* green title */
        }

       .service-container {
    display: flex;
    justify-content: center;
    align-items: center; /* vertically center */
    flex-wrap: wrap;
    gap: 20px;
    margin: 0 auto; /* horizontally center */
    min-height: 60vh; /* optional: gives vertical space */
}

        .service-card {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #0f9d58;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            transition: transform 0.3s, background-color 0.3s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            background-color: rgba(15, 157, 88, 0.8);
        }

        .service-card h3 {
            margin-top: 0;
            color: white;
        }

        .service-card p {
            color: #e0e0e0;
        }
    </style>
</head>
